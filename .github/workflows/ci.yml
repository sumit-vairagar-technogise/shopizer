name: Backend CI

on:
  push:
    branches: [ main, master, develop, 3.2.7 ]
  pull_request:
    branches: [ main, master, develop, 3.2.7 ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Run tests
        run: mvn test
      
      - name: Build artifact
        run: mvn clean package -DskipTests
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopizer-backend
          path: sm-shop/target/*.jar
          retention-days: 30
