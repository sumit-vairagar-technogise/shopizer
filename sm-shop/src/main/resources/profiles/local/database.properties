##
## db config - H2 File-Based Database (persists data)
##

# H2 Database (file-based, data persists across restarts)
db.jdbcUrl=jdbc:h2:file:./data/SALESMANAGER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;INIT=CREATE SCHEMA IF NOT EXISTS SALESMANAGER
db.user=sa
db.password=
db.driverClass=org.h2.Driver
hibernate.dialect=org.hibernate.dialect.H2Dialect
db.preferredTestQuery=SELECT 1

db.show.sql=false
db.schema=SALESMANAGER
hibernate.hbm2ddl.auto=update

##
#configuration connection pool
##
db.initialPoolSize=4
db.minPoolSize=4
db.maxPoolSize=20
db.maxPoolSize=4
